<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Code Protector</title>

<style>
:root{
  --neon:#00f5ff;
  --bg:#020617;
  --text:#e5e7eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#0f172a,#020617);
  font-family:Segoe UI,Arial;
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  width:95%;
  max-width:430px;
  background:linear-gradient(180deg,#020617,#020617) padding-box,
             linear-gradient(135deg,#00f5ff,#7c3aed) border-box;
  border:1px solid transparent;
  border-radius:20px;
  padding:22px;
  box-shadow:0 0 30px rgba(0,245,255,.15);
}
h1{text-align:center;color:var(--neon);margin:0}
.sub{text-align:center;font-size:12px;opacity:.7;margin-bottom:14px}
input,textarea,button{
  width:100%;margin-top:8px;padding:12px;
  border-radius:12px;border:none;outline:none;
}
input,textarea{
  background:#020617;color:#22c55e;border:1px solid #1e293b;
}
button{
  margin-top:14px;
  background:linear-gradient(135deg,#00f5ff,#7c3aed);
  color:#000;font-weight:700;
}
.file-info{font-size:12px;color:#7fffd4}
.log{height:90px;margin-top:12px}
.download{display:none}
.footer{margin-top:14px;font-size:11px;text-align:center;opacity:.7}
.footer a{color:#7fffd4}
</style>
</head>

<body>
<div class="card">
  <h1>🔐 Code Protector</h1>
  <div class="sub">Anti-Reverse • Chunk Encode • No Freeze</div>

  <input type="file" id="file">
  <div class="file-info" id="fname">Chưa chọn file</div>

  <input id="pw" placeholder="🔑 Mật khẩu">
  <input id="owner" placeholder="© Hà Hữu Xuyên">

  <button onclick="encrypt()">1️⃣ MÃ HÓA</button>
  <button id="downloadBtn" class="download">⬇️ TẢI FILE</button>

  <textarea id="log" class="log" readonly placeholder="Log..."></textarea>

  <div class="footer">
    © Hà Hữu Xuyên<br>
    📧 <a href="mailto:ptuan9505@gmail.com">ptuan9505@gmail.com</a><br>
    📱 Zalo: 0335853796
  </div>
</div>

<script>
const fileInput=document.getElementById("file");
const fname=document.getElementById("fname");
const logBox=document.getElementById("log");
const dlBtn=document.getElementById("downloadBtn");
let blobURL=null;

fileInput.onchange=()=>{
  fname.textContent=fileInput.files[0]
    ? "📄 "+fileInput.files[0].name
    : "Chưa chọn file";
};

function log(t){
  logBox.value+=t+"\\n";
  logBox.scrollTop=logBox.scrollHeight;
}

// 🔥 XOR CHUNK
function xorChunk(str,key,start,len){
  let out=[];
  for(let i=start;i<Math.min(start+len,str.length);i++){
    out.push(str.charCodeAt(i)^key.charCodeAt(i%key.length));
  }
  return out;
}

function encrypt(){
  const f=fileInput.files[0];
  if(!f) return alert("Chưa chọn file");
  const pw=document.getElementById("pw").value;
  if(!pw) return alert("Chưa nhập mật khẩu");
  const owner=document.getElementById("owner").value||"Hà Hữu Xuyên";

  log("🔄 Đang đọc file...");
  dlBtn.style.display="none";

  const reader=new FileReader();
  reader.onload=()=>{
    const src=reader.result;
    let pos=0;
    const CHUNK=8192;
    let result=[];

    log("🔐 Bắt đầu mã hóa...");

    function step(){
      if(pos<src.length){
        result.push(...xorChunk(src,pw,pos,CHUNK));
        pos+=CHUNK;
        log("⏳ "+Math.min(100,Math.floor(pos/src.length*100))+"%");
        setTimeout(step,0); // ⭐ NHẢ UI
      }else{
        finish();
      }
    }

    function finish(){
      const enc=btoa(String.fromCharCode(...result));
      const out=`# === PROTECTED FILE ===
# © ${owner}

import base64,hashlib,sys
DATA="${enc}"

pw=input("🔐 Nhap mat khau: ")
if hashlib.sha256(pw.encode()).hexdigest()!=hashlib.sha256("${pw}".encode()).hexdigest():
    print("❌ Sai mat khau")
    sys.exit()

raw=base64.b64decode(DATA)
real=bytes(raw[i]^pw.encode()[i%len(pw)] for i in range(len(raw)))
exec(real.decode())
`;
      const blob=new Blob([out],{type:"text/plain"});
      blobURL=URL.createObjectURL(blob);

      dlBtn.onclick=()=>{
        const a=document.createElement("a");
        a.href=blobURL;
        a.download=f.name;
        a.click();
      };

      dlBtn.style.display="block";
      log("✅ Hoàn tất. Bấm TẢI FILE.");
    }

    step();
  };
  reader.readAsText(f);
}
</script>
</body>
</html>
