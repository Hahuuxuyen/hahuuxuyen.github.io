<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Code Protector</title>
<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  font-family:Segoe UI,Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}
.card{
  width:95%;
  max-width:420px;
  background:rgba(0,0,0,.5);
  border-radius:18px;
  padding:22px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
}
h1{
  text-align:center;
  margin:0 0 12px;
}
label{
  font-size:13px;
  opacity:.85;
}
input,button,textarea{
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  box-sizing:border-box;
}
input,textarea{
  background:#111;
  color:#0f0;
}
button{
  margin-top:14px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button:active{transform:scale(.98)}
.file-name{
  font-size:12px;
  margin-top:4px;
  opacity:.9;
  color:#7fffd4;
}
.footer{
  margin-top:14px;
  text-align:center;
  font-size:12px;
  opacity:.85;
}
a{color:#7fffd4;text-decoration:none}
</style>
</head>
<body>

<div class="card">
  <h1>🔐 Code Protector</h1>

  <label>📂 Chọn file</label>
  <input type="file" id="file">
  <div class="file-name" id="fname">Chưa chọn file</div>

  <label>🔑 Mật khẩu</label>
  <input id="pw" placeholder="Nhập mật khẩu">

  <label>© Bản quyền</label>
  <input id="owner" placeholder="VD: Hà Hữu Xuyên">

  <button onclick="protect()">MÃ HÓA & TẢI FILE</button>

  <textarea id="log" rows="5" readonly placeholder="Log..."></textarea>

  <div class="footer">
    © Hà Hữu Xuyên<br>
    📧 <a href="mailto:ptuan9505@gmail.com">ptuan9505@gmail.com</a><br>
    📱 Zalo: 0335853796
  </div>
</div>

<script>
const fileInput=document.getElementById("file");
fileInput.onchange=()=>{
  document.getElementById("fname").textContent=
    fileInput.files[0]?fileInput.files[0].name:"Chưa chọn file";
};

function log(t){
  document.getElementById("log").value+=t+"\\n";
}

function xorEncode(str,key){
  let out=[];
  for(let i=0;i<str.length;i++){
    out.push(str.charCodeAt(i)^key.charCodeAt(i%key.length));
  }
  return btoa(String.fromCharCode(...out));
}

async function sha256(text){
  const buf=new TextEncoder().encode(text);
  const hash=await crypto.subtle.digest("SHA-256",buf);
  return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

async function protect(){
  const f=fileInput.files[0];
  if(!f) return alert("Chưa chọn file");
  const pw=document.getElementById("pw").value;
  if(!pw) return alert("Chưa nhập mật khẩu");
  const owner=document.getElementById("owner").value||"Hà Hữu Xuyên";

  const reader=new FileReader();
  reader.onload=async ()=>{
    const src=reader.result;
    const enc=xorEncode(src,pw);
    const pwh=await sha256(pw);
    const fake=btoa("print('Dang giai ma...')");

const out=`# === PROTECTED LEVEL 5 ===
# © ${owner}

import sys,inspect,base64,hashlib,time

OWNER="${owner}"
DATA="${enc}"
FAKE="${fake}"
PW_HASH="${pwh}"

def detect():
    if sys.gettrace(): return True
    for f in inspect.stack():
        if any(x in f.filename.lower() for x in
            ["uncompyle","decompile","pycdc","marshal","dis"]):
            return True
    return False

def fake_run():
    for i in range(3):
        print("🔄 Dang giai ma lop",i+1)
        time.sleep(0.6)
    print("""
❌ DAY KHONG PHAI CODE GOC
© Ban quyen: ${owner}
Kho lay lam, cut 😏
""")

if detect():
    exec(base64.b64decode(FAKE))
    fake_run()
    sys.exit()

pw=input("🔐 Nhap mat khau: ")
if hashlib.sha256(pw.encode()).hexdigest()!=PW_HASH:
    print("❌ Sai mat khau")
    sys.exit()

raw=base64.b64decode(DATA)
real=bytes(raw[i]^pw.encode()[i%len(pw)] for i in range(len(raw)))
exec(real.decode())
`;

    const blob=new Blob([out],{type:"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=f.name;
    a.click();

    log("✅ Đã mã hóa & tải file: "+f.name);
  };
  reader.readAsText(f);
}
</script>

</body>
</html>
