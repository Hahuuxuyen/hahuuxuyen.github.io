<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Code Protector</title>

<style>
:root{
  --neon:#00f5ff;
  --bg:#0b0f1a;
  --card:#111827;
  --text:#e5e7eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0f172a,#020617);
  font-family:Segoe UI,Arial;
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  width:95%;
  max-width:430px;
  background:linear-gradient(180deg,#020617,#020617) padding-box,
             linear-gradient(135deg,#00f5ff,#7c3aed) border-box;
  border:1px solid transparent;
  border-radius:20px;
  padding:22px;
  box-shadow:0 0 30px rgba(0,245,255,.15);
}
h1{
  text-align:center;
  margin:0 0 6px;
  color:var(--neon);
}
.sub{
  text-align:center;
  font-size:12px;
  opacity:.75;
  margin-bottom:14px;
}
label{
  font-size:12px;
  opacity:.8;
}
input,textarea,button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:14px;
}
input,textarea{
  background:#020617;
  color:#22c55e;
  border:1px solid #1e293b;
}
input:focus,textarea:focus{
  border-color:var(--neon);
}
button{
  margin-top:14px;
  background:linear-gradient(135deg,#00f5ff,#7c3aed);
  color:#000;
  font-weight:700;
  cursor:pointer;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.file-info{
  font-size:12px;
  margin-top:4px;
  color:#7fffd4;
}
.log{
  margin-top:12px;
  height:90px;
}
.footer{
  margin-top:14px;
  font-size:11px;
  text-align:center;
  opacity:.7;
}
.footer a{color:#7fffd4;text-decoration:none}
.download{
  display:none;
}
</style>
</head>

<body>

<div class="card">
  <h1>🔐 Code Protector</h1>
  <div class="sub">Anti-Reverse • Anti-Decompile • Level 5</div>

  <label>📂 Chọn file</label>
  <input type="file" id="file">
  <div class="file-info" id="fname">Chưa chọn file</div>

  <label>🔑 Mật khẩu</label>
  <input id="pw" placeholder="Nhập mật khẩu bảo vệ">

  <label>© Bản quyền</label>
  <input id="owner" placeholder="Hà Hữu Xuyên">

  <button onclick="encrypt()">1️⃣ MÃ HÓA FILE</button>

  <button class="download" id="downloadBtn">⬇️ TẢI FILE ĐÃ MÃ HÓA</button>

  <textarea class="log" id="log" readonly placeholder="Log..."></textarea>

  <div class="footer">
    © Hà Hữu Xuyên<br>
    📧 <a href="mailto:ptuan9505@gmail.com">ptuan9505@gmail.com</a><br>
    📱 Zalo: 0335853796
  </div>
</div>

<script>
let blobURL=null;
const fileInput=document.getElementById("file");
const fname=document.getElementById("fname");
const logBox=document.getElementById("log");
const dlBtn=document.getElementById("downloadBtn");

fileInput.onchange=()=>{
  fname.textContent=fileInput.files[0]
    ? "📄 "+fileInput.files[0].name
    : "Chưa chọn file";
};

function log(t){
  logBox.value+=t+"\\n";
  logBox.scrollTop=logBox.scrollHeight;
}

function xorEnc(str,key){
  let out=[];
  for(let i=0;i<str.length;i++){
    out.push(str.charCodeAt(i)^key.charCodeAt(i%key.length));
  }
  return btoa(String.fromCharCode(...out));
}

function encrypt(){
  const f=fileInput.files[0];
  if(!f) return alert("Chưa chọn file");
  const pw=document.getElementById("pw").value;
  if(!pw) return alert("Chưa nhập mật khẩu");
  const owner=document.getElementById("owner").value||"Hà Hữu Xuyên";

  log("🔄 Đang mã hóa...");
  dlBtn.style.display="none";

  const reader=new FileReader();
  reader.onload=()=>{
    const enc=xorEnc(reader.result,pw);

const out=`# === PROTECTED LEVEL 5 ===
# © ${owner}

import base64,hashlib,sys

OWNER="${owner}"
DATA="${enc}"

pw=input("🔐 Nhap mat khau: ")
if hashlib.sha256(pw.encode()).hexdigest()!=hashlib.sha256("${pw}".encode()).hexdigest():
    print("❌ Sai mat khau")
    sys.exit()

raw=base64.b64decode(DATA)
real=bytes(raw[i]^pw.encode()[i%len(pw)] for i in range(len(raw)))
exec(real.decode())
`;

    const blob=new Blob([out],{type:"text/plain"});
    blobURL=URL.createObjectURL(blob);

    dlBtn.onclick=()=>{
      const a=document.createElement("a");
      a.href=blobURL;
      a.download=f.name;
      a.click();
    };

    dlBtn.style.display="block";
    log("✅ Mã hóa xong. Bấm TẢI FILE.");
  };
  reader.readAsText(f);
}
</script>

</body>
</html>
