<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gọi Món Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#ffecd2,#fcb69f);min-height:100vh;margin:0;padding:20px}
    .card{max-width:520px;margin:auto;background:#fff;border-radius:18px;box-shadow:0 20px 40px rgba(0,0,0,.15);overflow:hidden}
    .header{background:linear-gradient(135deg,#ff7a18,#ffb347);color:#fff;padding:18px 22px}
    .header h1{margin:0;font-size:22px}
    .content{padding:20px}
    label{font-size:13px;color:#555}
    input,textarea,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:14px}
    textarea{resize:none}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .foods .food-item{display:grid;grid-template-columns:1fr 90px 36px;gap:8px;margin-bottom:8px}
    .btn{background:#ff7a18;color:#fff;border:none;font-weight:700;cursor:pointer}
    .btn.secondary{background:#eee;color:#333}
    .btn.small{padding:8px}
    .footer{padding:14px 20px;background:#fafafa;border-top:1px solid #eee}
    .msg{margin-top:8px;font-weight:600}
    .ok{color:#1a7f37}
    .err{color:#c92a2a}
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🍔 Gọi Món Online</h1>
      <div>Đặt món nhanh – gửi về Telegram</div>
    </div><div class="content">
  <label>Tên khách hàng</label>
  <input id="name" placeholder="Nhập tên" />

  <div class="row">
    <div>
      <label>Số điện thoại</label>
      <input id="phone" placeholder="09xxxxxxxx" />
    </div>
    <div>
      <label>Ghi chú</label>
      <input id="note" placeholder="Ít đá, cay..." />
    </div>
  </div>

  <label>Địa chỉ giao hàng</label>
  <textarea id="address" rows="2" placeholder="Số nhà, đường, phường..."></textarea>

  <label>Món ăn</label>
  <div class="foods" id="foods"></div>
  <button type="button" class="btn secondary" onclick="addFood()">➕ Thêm món</button>

  <button class="btn" onclick="sendOrder()">🚀 Gửi đơn</button>
  <div id="msg" class="msg"></div>
</div>

<div class="footer">© Gọi Món</div>

  </div><script>
// ĐÃ GẮN TOKEN BOT THEO THÔNG TIN BẠN ĐÃ LƯU TRƯỚC ĐÓ
const BOT_TOKEN = "8340836312:AAHC87iQUxbONjja4TlMYNLdMlW5HJQ05hU";
const CHAT_ID = "YOUR_CHAT_ID"; // thay chat id của bạn

let foodCount = 0;
function addFood(){
  foodCount++;
  const div = document.createElement('div');
  div.className = 'food-item';
  div.innerHTML = `
    <input placeholder="Tên món" id="food_${foodCount}" />
    <input placeholder="SL" id="qty_${foodCount}" />
    <button class="btn small secondary" onclick="this.parentNode.remove()">✖</button>
  `;
  document.getElementById('foods').appendChild(div);
}
addFood();

function sendOrder(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const note = document.getElementById('note').value.trim();

  let food = '';
  for(let i=1;i<=foodCount;i++){
    const f = document.getElementById(`food_${i}`)?.value;
    const q = document.getElementById(`qty_${i}`)?.value;
    if(f && q) food += `- ${f} x ${q}\n`;
  }

  if(!name || !phone || !address || !food){
    msg('❌ Vui lòng nhập đủ thông tin','err');
    return;
  }

  const text = `📦 ĐƠN GỌI MỚI\n\n👤 ${name}\n📞 ${phone}\n🏠 ${address}\n📝 ${note || 'Không'}\n\n🍽 Món:\n${food}`;

  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:CHAT_ID,text})
  })
  .then(r=>r.json()).then(()=>msg('✅ Gửi đơn thành công','ok'))
  .catch(()=>msg('❌ Lỗi gửi đơn','err'));
}
function msg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+c}
</script></body>
</html>
