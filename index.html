<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Code Protector</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
  background:linear-gradient(135deg,#050b1a,#0b2a3a);
  font-family:system-ui;
  color:#fff;
  display:flex;
  justify-content:center;
  padding:20px
}
.box{
  width:100%;
  max-width:420px;
  background:#0a1428;
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 30px #00eaff55
}
h1{
  text-align:center;
  color:#00eaff;
  margin-bottom:5px
}
.sub{
  text-align:center;
  opacity:.8;
  font-size:13px;
  margin-bottom:15px
}
input,button{
  width:100%;
  margin:8px 0;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:15px
}
input{
  background:#101c33;
  color:#fff
}
button{
  background:linear-gradient(90deg,#00eaff,#7b5cff);
  color:#000;
  font-weight:bold
}
#downloadBtn{
  display:none;
  background:#19ff8c;
  color:#000
}
#log{
  margin-top:10px;
  height:120px;
  overflow:auto;
  background:#020817;
  border-radius:10px;
  padding:10px;
  font-size:13px
}
.footer{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  opacity:.8
}
.footer b{color:#00eaff}
</style>
</head>

<body>
<div class="box">
  <h1>🔐 Code Protector</h1>
  <div class="sub">Anti-Reverse · Chunk Encode · No Freeze</div>

  <input type="file" id="file" accept=".py">
  <input id="pass" placeholder="🔑 Mật khẩu">
  <input id="owner" placeholder="© Bản quyền (VD: Hà Hữu Xuyên)">

  <button onclick="start()">🔐 MÃ HÓA</button>
  <button id="downloadBtn">⬇️ TẢI FILE ĐÃ MÃ HÓA</button>

  <div id="log"></div>

  <div class="footer">
    © <b>Hà Hữu Xuyên</b><br>
    📧 ptuan9505@gmail.com<br>
    📱 Zalo: 0335853796
  </div>
</div>

<script>
const logBox=document.getElementById("log");
const dlBtn=document.getElementById("downloadBtn");
let blobURL=null;

function log(t){
  logBox.innerHTML+=t+"<br>";
  logBox.scrollTop=logBox.scrollHeight;
}

function sha256(str){
  const buf=new TextEncoder().encode(str);
  return crypto.subtle.digest("SHA-256",buf)
    .then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""));
}

async function start(){
  logBox.innerHTML="";
  dlBtn.style.display="none";

  const f=document.getElementById("file").files[0];
  if(!f){log("❌ Chưa chọn file");return}

  const pass=document.getElementById("pass").value;
  const owner=document.getElementById("owner").value||"Unknown";

  log("📄 File: "+f.name);
  log("🔐 Đang mã hóa...");

  const text=await f.text();
  const passHash=await sha256(pass);
  const data=btoa(unescape(encodeURIComponent(text)));

  let out=
`# ==== CODE PROTECTED ====
# Owner: ${owner}
import base64,hashlib,sys

PASS_HASH="${passHash}"
DATA="${data}"

pw=input("🔑 Nhập mật khẩu: ")
if hashlib.sha256(pw.encode()).hexdigest()!=PASS_HASH:
    print("❌ Truy cập trái phép")
    sys.exit()

exec(compile(base64.b64decode(DATA),"protected","exec"))
`;

  finish(out,f.name);
}

function finish(out,name){
  const blob=new Blob([out],{type:"text/plain"});
  blobURL=URL.createObjectURL(blob);

  dlBtn.style.display="block";
  dlBtn.onclick=()=>{
    const a=document.createElement("a");
    a.href=blobURL;
    a.download="protected_"+name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  log("✅ Mã hóa hoàn tất");
  log("⬇️ Nhấn nút tải file");
}
</script>
</body>
</html>
